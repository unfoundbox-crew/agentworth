name: CI

# Path-aware: a docs-only PR shouldn't pay for a Rust build, and a Rust-only PR
# shouldn't pay for the marketing site. rust-embed means the reverse doesn't
# hold -- any dashboard (or shared packages/ui) change has to retest Rust too,
# since the dashboard build is compiled into the binary.
#
# push to main always runs the full set (no filtering) as a post-merge gate,
# regardless of what changed in the merge commit.
#
# ubuntu-latest only for the build/lint jobs, per the free-tier budget rule.
# The Rust test job also runs on macos-latest -- macOS hosted minutes are free
# on this public repo, and the npm launcher shipped a macOS-only bug before
# (v0.1.11) that ubuntu-only CI could not have caught.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    # On push to main this job's outputs are unused -- every downstream job
    # short-circuits to "always run" instead of reading them. Still runs so
    # the job graph stays uniform.
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      web: ${{ steps.filter.outputs.web }}
      launcher: ${{ steps.filter.outputs.launcher }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/cli/**'
              - 'apps/dashboard/**'
              - 'apps/home/**'
              - 'packages/ui/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              # A hand-edit to either generated file has to run the staleness
              # check below, or it would otherwise be misclassified as
              # "docs-only" and skip Rust CI entirely.
              - 'docs/REFERENCE.md'
              - 'docs/reference.json'
            dashboard:
              - 'apps/dashboard/**'
              - 'packages/ui/**'
            web:
              - 'apps/web/**'
              - 'packages/ui/**'
            launcher:
              - 'packages/agentworth/**'
              - 'packages/dsh-plugin-agentworth/**'

  # No dedicated "docs_only" filter: docs-only is just the case where none of
  # the build-triggering filters above matched. Computed here instead of via
  # a paths-filter negation pattern, which is fragile for an "AND-NOT" of
  # several independent categories.
  docs-only:
    name: Docs-only change
    needs: changes
    if: |
      github.event_name == 'pull_request' &&
      needs.changes.outputs.rust != 'true' &&
      needs.changes.outputs.web != 'true' &&
      needs.changes.outputs.launcher != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "docs only, nothing to build"

  build-rust:
    name: Build & test workspace
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/dashboard/package-lock.json'

      # Order matters: the dashboard is compiled into the binary via rust-embed,
      # so it has to exist before cargo runs. This mirrors release.yml exactly --
      # if the order is wrong here, it is wrong there too.
      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm ci && npm run build

      # Same reason as the dashboard above: apps/home is compiled into the binary too
      # (apps/cli/src/server/static_files.rs, `HomeDeckAssets`), served under `/home` by
      # `archie serve --home` / `archie home`. Must exist before cargo builds.
      # `npm run build` already runs `tsc` (see apps/home/package.json).
      # The deck's vitest suite runs first (non-watch) — a unit failure is
      # cheaper to read than a tunnel-visioned cargo failure.
      - name: Build home deck
        working-directory: apps/home
        run: npm ci && npm run test -- --reporter=dot && npm run build

      # `npm run build` already runs `tsc` (see apps/dashboard/package.json), so this is
      # redundant with the step above in practice -- it's kept as its own named step so a
      # Rust/TS API contract drift (apps/dashboard/src/types/contract.test.ts, see
      # apps/dashboard/README.md) fails CI with an unambiguous label instead of buried inside
      # a generic "Build dashboard" failure.
      - name: Dashboard typecheck (Rust/TS API contract)
        working-directory: apps/dashboard
        run: npm run typecheck

      # Each dist must hold THAT app's build. apps/dashboard/dist was once found holding
      # apps/home's output -- both emit an index.html, so nothing downstream noticed, and
      # `/` served home's shell while looking like a broken dashboard. That misread is what
      # got a working app deleted in PR #182. These checks discriminate: each asserts a
      # marker only its own app emits, so a cross-app build fails here instead of shipping.
      - name: Assert each dist holds its own app
        shell: bash
        run: |
          test -f apps/dashboard/dist/index.html \
            || { echo "::error::apps/dashboard/dist/index.html missing — the binary would ship without a UI"; exit 1; }
          test -f apps/home/dist/index.html \
            || { echo "::error::apps/home/dist/index.html missing — archie home would ship with no deck"; exit 1; }
          # dashboard builds with base '/' and titles itself "AgentWorth"
          # (apps/dashboard/vite.config.ts, apps/dashboard/index.html); the deck builds with
          # base '/home/' and titles itself "home". Neither marker appears in the other.
          grep -q "<title>AgentWorth</title>" apps/dashboard/dist/index.html \
            || { echo "::error::apps/dashboard/dist is not dashboard's own build (no <title>AgentWorth</title>) — cross-app build?"; exit 1; }
          ! grep -q "/home/assets/" apps/dashboard/dist/index.html \
            || { echo "::error::apps/dashboard/dist holds apps/home's build (/home/assets/ prefix) — cross-app contamination"; exit 1; }
          grep -q "/home/assets/" apps/home/dist/index.html \
            || { echo "::error::apps/home/dist is not the deck's own build (no /home/assets/ prefix)"; exit 1; }

      - name: Build workspace
        run: cargo build --workspace --bin agentworth --bin archie

      # Proves each app is actually inside the binary rather than merely built next to it.
      # The dashboard check here used to be `grep -q "AgentWorth"`, which could never fail:
      # that string is in the CLI's own help text and in static_files.rs's FALLBACK_HTML
      # placeholder, so it stayed green through an empty AND a contaminated
      # apps/dashboard/dist. Each side now greps the exact hashed asset path its own
      # index.html references, which lands in the binary only if that app's built HTML did.
      - name: Assert the dashboard and home deck are inside the binary
        shell: bash
        run: |
          BIN=target/debug/archie
          DASH_ASSET="$(grep -o '/assets/[A-Za-z0-9._-]*\.js' apps/dashboard/dist/index.html | head -1)"
          HOME_ASSET="$(grep -o '/home/assets/[A-Za-z0-9._-]*\.js' apps/home/dist/index.html | head -1)"
          test -n "$DASH_ASSET" \
            || { echo "::error::could not read dashboard's asset path out of its index.html"; exit 1; }
          test -n "$HOME_ASSET" \
            || { echo "::error::could not read the deck's asset path out of its index.html"; exit 1; }
          grep -q "$DASH_ASSET" "$BIN" \
            || { echo "::error::dashboard build ($DASH_ASSET) is not inside the binary"; exit 1; }
          grep -q "$HOME_ASSET" "$BIN" \
            || { echo "::error::home deck build ($HOME_ASSET) is not inside the binary"; exit 1; }
          echo "binary size: $(du -h "$BIN" | cut -f1)"

      # Must run after the dashboard build above — rust-embed needs
      # apps/dashboard/dist to exist, and apps/cli's static-file tests read
      # from it directly.
      - name: Run workspace tests
        run: cargo test --workspace

      # The `recovery.rs:571` panic (v0.1.15) happened during a real `agwt scan`, on real
      # transcripts, not in a unit test -- so the regression gate is the built binary doing a
      # real scan over a real (synthetic) multilingual corpus. ubuntu-only: this is about the
      # binary's behavior, not the OS, and one leg is enough.
      - name: Generate multilingual corpus (Hebrew, Arabic, CJK, emoji, combining marks)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 apps/cli/tests/fixtures/gen_multilingual_corpus.py "${{ runner.temp }}/multilingual-corpus"

      - name: Scan and stats over the multilingual corpus must not crash
        if: matrix.os == 'ubuntu-latest'
        run: |
          BIN=target/debug/agentworth
          DB="${{ runner.temp }}/multilingual-corpus.db"
          "$BIN" --db-path "$DB" scan "${{ runner.temp }}/multilingual-corpus" \
            || { echo "::error::agentworth scan crashed or failed on the multilingual corpus"; exit 1; }
          "$BIN" --db-path "$DB" stats \
            || { echo "::error::agentworth stats crashed or failed after the multilingual scan"; exit 1; }

      # ubuntu only -- one machine's worth of "does the committed reference match the
      # code" is enough, and it saves paying for this on macOS too. Regenerates
      # docs/REFERENCE.md and docs/reference.json (apps/cli/src/commands/docs.rs) and
      # fails if either differs from what's committed, so the reference can't go stale.
      # Both files carry a "generated on <date>" stamp that legitimately differs between
      # a same-day regeneration and any other day, so that one field/line is stripped
      # from each side before diffing -- this only fails on a real content drift.
      - name: Reference docs are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp docs/REFERENCE.md /tmp/committed-REFERENCE.md
          cp docs/reference.json /tmp/committed-reference.json
          cargo run -p agentworth-cli --bin agentworth -- docs --write
          fail=0
          if ! diff -u <(grep -v '^_Generated by' /tmp/committed-REFERENCE.md) <(grep -v '^_Generated by' docs/REFERENCE.md); then
            fail=1
          fi
          if ! diff -u <(jq 'del(.generatedDate)' /tmp/committed-reference.json) <(jq 'del(.generatedDate)' docs/reference.json); then
            fail=1
          fi
          if [ "$fail" = 1 ]; then
            echo "::error::docs/REFERENCE.md and/or docs/reference.json are stale. Run 'cargo run -p agentworth-cli -- docs --write' and commit the result."
            exit 1
          fi

  clippy:
    name: Clippy
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/dashboard/package-lock.json'

      # clippy --all-targets compiles apps/cli, whose build.rs and rust-embed
      # folder need a real dashboard/dist to exist -- same ordering constraint
      # as the build job above.
      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm ci && npm run build

      # Same ordering constraint: apps/home is a second rust-embed folder.
      - name: Build home deck
        working-directory: apps/home
        run: npm ci && npm run build

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  build-web:
    name: Build marketing site
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/web/package-lock.json'

      - name: Build marketing site
        working-directory: apps/web
        run: npm ci && npm run build

      # install.sh is the first thing most people run and nothing else tests it.
      # /bin/sh is dash on Ubuntu, so parsing it there catches a bashism that the
      # developer's zsh or bash would have accepted. The glyph check is the same
      # rule the CLI enforces on itself in apps/cli/src/ui/mod.rs.
      - name: Install script is POSIX sh and stays inside the glyph set
        run: |
          /bin/sh -n apps/web/public/install.sh
          python3 - <<'EOF'
          import sys
          bad = []
          with open('apps/web/public/install.sh', encoding='utf-8') as f:
              for n, line in enumerate(f, 1):
                  for ch in line:
                      cp = ord(ch)
                      ok = cp < 128 or 0x2500 <= cp <= 0x259F or ch in '\u25cf\u25cb\u00b7\u2014\u2192'
                      if not ok:
                          bad.append(f"line {n}: U+{cp:04X} ({ch})")
          if bad:
              print("install.sh ships a glyph outside the allowed set:", *bad, sep="\n")
              sys.exit(1)
          EOF

  launcher-tests:
    name: npm launcher tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.launcher == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'packages/agentworth/package-lock.json'

      # The npm launcher (packages/agentworth) has its own test suite -- a red
      # launcher test (formatMissingBinaryMessage vs. stale brew/curl assertions)
      # sat unnoticed on main for a while because nothing ran it in CI before.
      - name: Run npm launcher tests
        working-directory: packages/agentworth
        run: npm ci && npm test

      # The dsh bundle has no dependencies to install; its tests pin the
      # bundled SKILL.md to skills/agentworth/SKILL.md and the npx pin to the
      # package version.
      - name: Run dsh bundle tests
        working-directory: packages/dsh-plugin-agentworth
        run: npm test

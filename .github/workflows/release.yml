name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  version-gate:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v0.1.3 was tagged from a tree where Cargo.toml still said 0.1.2, so the
      # released binary reported the wrong version and the npm launcher (which
      # builds its download URL from package.json) could 404. Fail before building.
      - name: Tag, Cargo.toml and package.json must agree
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME#v}
          CARGO=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          NPM=$(node -p "require('./packages/agentworth/package.json').version")
          echo "tag=$TAG cargo=$CARGO npm=$NPM"
          FAIL=0
          [ "$TAG" = "$CARGO" ] || { echo "::error::tag $TAG != Cargo.toml $CARGO"; FAIL=1; }
          [ "$TAG" = "$NPM" ]   || { echo "::error::tag $TAG != package.json $NPM"; FAIL=1; }
          if [ "$FAIL" = "1" ]; then
            echo "::error::Bump every version to $TAG and re-tag before releasing."
            exit 1
          fi

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: version-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: agentworth
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: agentworth
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: agentworth
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary_name: agentworth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: |
          cargo build --release --target ${{ matrix.target }} --bin agentworth

      - name: Package artifact
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BIN_PATH="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          
          # Strip symbols to reduce bundle size
          if command -v strip >/dev/null 2>&1; then
            strip "$BIN_PATH" || true
          fi
          
          ARCHIVE_NAME="agentworth-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" "${{ matrix.binary_name }}"
          
          # Generate SHA256 checksum
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          else
            sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            agentworth-*.tar.gz
            agentworth-*.sha256

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

  publish-npm:
    name: Publish to NPM
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Update package.json version from tag
        working-directory: packages/agentworth
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Verify NPM credentials before publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is empty or unset."
            exit 1
          fi
          # A 404 on PUT to an existing package means auth, not a missing package.
          # Catch it here so the failure names the real cause.
          if ! WHO=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN is invalid or expired. npm whoami said: ${WHO}"
            echo "::error::Mint a new *Automation* token (classic) or a granular token with"
            echo "::error::read+write on the 'agentworth' package, then update the NPM_TOKEN secret."
            exit 1
          fi
          echo "Authenticated to npm as: ${WHO}"
          if ! npm access list packages "${WHO}" 2>/dev/null | grep -q agentworth; then
            echo "::warning::${WHO} may not have write access to 'agentworth'. Publish may 404."
          fi

      - name: Publish package to NPM
        working-directory: packages/agentworth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public

  smoke-test:
    name: Smoke test (${{ matrix.os }})
    needs: publish-npm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the registry to serve the new version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for i in $(seq 1 30); do
            if npm view "agentworth@${VERSION}" version >/dev/null 2>&1; then
              echo "agentworth@${VERSION} is live on the registry."
              exit 0
            fi
            echo "attempt $i: not on the registry yet, waiting 10s..."
            sleep 10
          done
          echo "::error::agentworth@${VERSION} never appeared on the registry."
          exit 1

      - name: Install and run exactly as a new user would
        shell: bash
        timeout-minutes: 6
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Clean room: no repo checkout, no cargo target dir, no ~/.agentworth cache.
          # This is the case that shipped broken and that nothing was checking.
          OUT=$(npx -y "agentworth@${VERSION}" --version </dev/null 2>&1) || {
            echo "::error::npx agentworth@${VERSION} --version failed"
            echo "${OUT}"
            exit 1
          }
          echo "${OUT}"
          echo "${OUT}" | grep -qi agentworth || {
            echo "::error::--version output did not mention agentworth"
            exit 1
          }

      - name: Run the command the landing pages advertise
        shell: bash
        timeout-minutes: 6
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npx -y "agentworth@${VERSION}" usage --pacing </dev/null

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  version-gate:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v0.1.3 was tagged from a tree where Cargo.toml still said 0.1.2, so the
      # released binary reported the wrong version and the npm launcher (which
      # builds its download URL from package.json) could 404. Fail before building.
      - name: Tag, Cargo.toml, package.json, plugin.json and the dsh bundle must agree
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME#v}
          CARGO=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          NPM=$(node -p "require('./packages/agentworth/package.json').version")
          PLUGIN=$(node -p "require('./.claude-plugin/plugin.json').version")
          PLUGIN_NPX=$(node -p "require('./.claude-plugin/plugin.json').mcpServers.agentworth.args.find(a => a.startsWith('agentworth@')).slice('agentworth@'.length)")
          DSH=$(node -p "require('./packages/dsh-plugin-agentworth/package.json').version")
          DSH_NPX=$(grep -oE "agentworth@[0-9][^' ]*" packages/dsh-plugin-agentworth/cordis.patch.yml | head -1 | cut -d@ -f2)
          echo "tag=$TAG cargo=$CARGO npm=$NPM plugin=$PLUGIN plugin-npx=$PLUGIN_NPX dsh=$DSH dsh-npx=$DSH_NPX"
          FAIL=0
          [ "$TAG" = "$CARGO" ] || { echo "::error::tag $TAG != Cargo.toml $CARGO"; FAIL=1; }
          [ "$TAG" = "$NPM" ]   || { echo "::error::tag $TAG != package.json $NPM"; FAIL=1; }
          [ "$TAG" = "$PLUGIN" ]     || { echo "::error::tag $TAG != .claude-plugin/plugin.json version $PLUGIN"; FAIL=1; }
          [ "$TAG" = "$PLUGIN_NPX" ] || { echo "::error::tag $TAG != .claude-plugin/plugin.json npx pin $PLUGIN_NPX"; FAIL=1; }
          [ "$TAG" = "$DSH" ]     || { echo "::error::tag $TAG != packages/dsh-plugin-agentworth/package.json version $DSH"; FAIL=1; }
          [ "$TAG" = "$DSH_NPX" ] || { echo "::error::tag $TAG != packages/dsh-plugin-agentworth/cordis.patch.yml npx pin $DSH_NPX"; FAIL=1; }
          if [ "$FAIL" = "1" ]; then
            echo "::error::Bump every version to $TAG and re-tag before releasing."
            exit 1
          fi

  build-binaries:
    name: Build (${{ matrix.target }})
    needs: version-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Windows dropped 2026-09-02: the npm launcher's tar extraction kept breaking
          # on Windows-style paths (a drive letter before the colon parses as a remote
          # "host:path" tar spec) across multiple releases. macOS/Linux only for now --
          # see resolver.js's PLATFORM_TARGETS for the matching runtime-side change.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/dashboard/package-lock.json'

      # Must run before cargo: the dashboard is compiled INTO the binary via
      # rust-embed, so an empty apps/dashboard/dist ships a binary that serves
      # a build-me notice instead of a UI. That is what shipped until now.
      - name: Build dashboard
        working-directory: apps/dashboard
        run: |
          npm ci
          npm run build

      - name: Assert the dashboard will actually be embedded
        shell: bash
        run: |
          test -f apps/dashboard/dist/index.html \
            || { echo "::error::apps/dashboard/dist/index.html missing — the binary would ship without a UI"; exit 1; }
          echo "dashboard dist: $(du -sh apps/dashboard/dist | cut -f1)"

      - name: Build binaries
        run: |
          cargo build --release --target ${{ matrix.target }} --bin agentworth --bin archie --bin agwt

      - name: Package artifact
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          RELEASE_DIR="target/${{ matrix.target }}/release"

          # Strip symbols to reduce bundle size
          if command -v strip >/dev/null 2>&1; then
            strip "$RELEASE_DIR/agentworth" || true
            strip "$RELEASE_DIR/archie" || true
            strip "$RELEASE_DIR/agwt" || true
          fi

          ARCHIVE_NAME="agentworth-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" -C "$RELEASE_DIR" agentworth archie agwt

          # Generate SHA256 checksum
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          else
            sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            agentworth-*.tar.gz
            agentworth-*.sha256

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

  publish-npm:
    name: Publish to NPM
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for OIDC / trusted publishing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Trusted publishing needs npm >= 11.5.1; node 24 ships a recent npm but
      # pin it explicitly so a runner image change cannot silently regress us.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)"
          node -e '
            const v = require("child_process").execSync("npm --version").toString().trim().split(".").map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 1)));
            if (!ok) { console.error("::error::npm >= 11.5.1 required for trusted publishing"); process.exit(1); }
            console.log("npm version OK for trusted publishing");
          '

      - name: Update package.json version from tag
        working-directory: packages/agentworth
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # No NPM_TOKEN. The npm CLI detects the OIDC environment and exchanges the
      # GitHub identity token for a short-lived npm credential. This replaces the
      # bypass-2FA granular token, which npm restricted on 2026-07-31 and plans to
      # stop accepting for publish in January 2027.
      # Requires a Trusted Publisher configured on npmjs.com for:
      #   org/user: unfoundbox-crew · repo: agentworth · workflow: release.yml
      - name: Publish package to NPM (trusted publishing / OIDC)
        working-directory: packages/agentworth
        run: |
          if ! npm publish --access public 2>&1 | tee /tmp/publish.log; then
            if grep -qiE "trusted publisher|oidc|not configured" /tmp/publish.log; then
              echo "::error::Trusted Publisher is not configured on npmjs.com."
              echo "::error::Add one on the agentworth package: Settings -> Trusted Publisher"
              echo "::error::  org/user: unfoundbox-crew, repo: agentworth, workflow: release.yml"
              echo "::error::  allowed actions: npm publish"
            fi
            exit 1
          fi

      # The dsh bundle is plain files, no binary: it publishes right after the
      # launcher so `dsh plugin add dsh-plugin-agentworth` resolves the same
      # version its cordis.patch.yml pins. The first publish of a new npm
      # package cannot go through OIDC (the package has to exist before a
      # Trusted Publisher can be attached to it), so a missing package is
      # reported as its own error rather than as a generic failure.
      - name: Publish dsh-plugin-agentworth to NPM (trusted publishing / OIDC)
        working-directory: packages/dsh-plugin-agentworth
        run: |
          if ! npm publish --access public 2>&1 | tee /tmp/publish-dsh.log; then
            if grep -qiE "trusted publisher|oidc|not configured|404|E404" /tmp/publish-dsh.log; then
              echo "::error::dsh-plugin-agentworth: first publish by hand (npm publish from packages/dsh-plugin-agentworth), then add a Trusted Publisher:"
              echo "::error::  org/user: unfoundbox-crew, repo: agentworth, workflow: release.yml, allowed actions: npm publish"
            fi
            exit 1
          fi

  smoke-test:
    name: Smoke test (${{ matrix.os }})
    needs: publish-npm
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the registry to serve the new version
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for i in $(seq 1 30); do
            if npm view "agentworth@${VERSION}" version >/dev/null 2>&1; then
              echo "agentworth@${VERSION} is live on the registry."
              exit 0
            fi
            echo "attempt $i: not on the registry yet, waiting 10s..."
            sleep 10
          done
          echo "::error::agentworth@${VERSION} never appeared on the registry."
          exit 1

      - name: Install and run exactly as a new user would
        shell: bash
        timeout-minutes: 6
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          # The registry does not serve a new version the instant publish
          # returns. v0.1.6 published fine and both smoke tests failed seconds
          # later with ETARGET, reporting a good release as broken. Wait for the
          # version to actually be resolvable before concluding anything.
          for i in $(seq 1 30); do
            if npm view "agentworth@${VERSION}" version >/dev/null 2>&1; then
              echo "agentworth@${VERSION} resolvable after $(( i * 10 ))s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::agentworth@${VERSION} still not on the registry after 5 minutes"
              exit 1
            fi
            sleep 10
          done

          # Clean room: no repo checkout, no cargo target dir, no ~/.agentworth cache.
          # This is the case that shipped broken and that nothing was checking.
          OUT=$(npx -y "agentworth@${VERSION}" --version </dev/null 2>&1) || {
            echo "::error::npx agentworth@${VERSION} --version failed"
            echo "${OUT}"
            exit 1
          }
          echo "${OUT}"
          echo "${OUT}" | grep -qi agentworth || {
            echo "::error::--version output did not mention agentworth"
            exit 1
          }

      - name: Run the command the landing pages advertise
        shell: bash
        timeout-minutes: 6
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npx -y "agentworth@${VERSION}" usage --pacing </dev/null

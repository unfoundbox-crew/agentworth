[package]
build = "build.rs"
name = "agentworth-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "agentworth_cli"
path = "src/lib.rs"

[[bin]]
name = "agentworth"
path = "src/main.rs"

[[bin]]
name = "agwt"
path = "src/bin/agwt.rs"

# The short name from 0.1.16 on. `agwt` still ships and still works; every doc, help string
# and install line says `archie`.
[[bin]]
name = "archie"
path = "src/bin/archie.rs"

[dependencies]
agentworth-schema.workspace = true
agentworth-adapter-sdk.workspace = true
agentworth-adapters.workspace = true
agentworth-storage = { workspace = true, default-features = false }
agentworth-core = { workspace = true, default-features = false }
agentworth-redaction.workspace = true
agentworth-export-atif.workspace = true
agentworth-outcomes.workspace = true
agentworth-scoring.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
directories.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
console.workspace = true
axum = "0.7"
rust-embed = "8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.4", features = ["util"] }
tower-service = "0.3"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-gzip", "compression-br"] }
open = "5.3"
notify = "8"
regex.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite.workspace = true
# The official Rust MCP SDK (modelcontextprotocol/rust-sdk), backing `agentworth mcp`
# (docs/specs/mcp-server.md). Pinned to an exact version since it's still pre-1.0 (3.x line,
# 2026-07-28 spec). Default features already include "server" and "macros"; "transport-io"
# backs the server's own stdio() transport. "client" and "transport-child-process" back
# `agentworth doctor --self-test` (apps/cli/src/commands/self_test.rs), which spawns
# `agentworth mcp` as a real child process and round-trips tools/list and session_get
# against it the same way a coding agent's MCP client would.
rmcp = { version = "=3.2.0", features = ["transport-io", "client", "transport-child-process"] }
schemars = "1.0"
# The cockpit (`archie`, `archie tui`), spec section 3. Verified on docs.rs 2026-09-02:
# 0.30.2 is the newest release, and `crossterm` is one of its seven default features
# (it pulls ratatui-crossterm over crossterm 0.29, and implies `std`). Pinned exactly,
# like rmcp above, because a TUI breaks visibly rather than loudly when a backend
# changes under it.
#
# Defaults are off and only `crossterm` is asked for, which keeps the other three
# backends -- termina, termwiz and its wezterm tree, termion -- and the syn 1.x they drag
# in out of Cargo.lock entirely. Nothing else in the workspace depended on crossterm, so
# there is exactly one copy of it in the lock.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
# Restores the terminal when the cockpit is killed rather than quit (SIGTERM, SIGHUP).
# Already in the graph under crossterm; named here because a transitive dependency is not
# something to `use`.
signal-hook = "0.3"

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2.0"
predicates = "3.1"
http-body-util = "0.1"


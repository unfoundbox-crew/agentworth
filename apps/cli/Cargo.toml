[package]
build = "build.rs"
name = "agentworth-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "agentworth_cli"
path = "src/lib.rs"

[[bin]]
name = "agentworth"
path = "src/main.rs"

[[bin]]
name = "agwt"
path = "src/bin/agwt.rs"

[dependencies]
agentworth-schema.workspace = true
agentworth-adapter-sdk.workspace = true
agentworth-adapters.workspace = true
agentworth-storage = { workspace = true, default-features = false }
agentworth-core = { workspace = true, default-features = false }
agentworth-redaction.workspace = true
agentworth-export-atif.workspace = true
agentworth-outcomes.workspace = true
agentworth-scoring.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
indicatif.workspace = true
console.workspace = true
axum = "0.7"
rust-embed = "8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.4", features = ["util"] }
tower-service = "0.3"
tower-http = { version = "0.5", features = ["cors", "fs", "trace", "compression-gzip", "compression-br"] }
open = "5.3"
notify = "8"
regex.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite.workspace = true
# The official Rust MCP SDK (modelcontextprotocol/rust-sdk), backing `agentworth mcp`
# (docs/specs/mcp-server.md). Pinned to an exact version since it's still pre-1.0 (3.x line,
# 2026-07-28 spec). Default features already include "server" and "macros"; "transport-io"
# additionally pulls in the stdio() transport helper.
rmcp = { version = "=3.2.0", features = ["transport-io"] }
schemars = "1.0"

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2.0"
predicates = "3.1"
http-body-util = "0.1"
# "client" is test-only: the production binary never acts as an MCP client, but the stdio
# integration test in tests/mcp_stdio_test.rs drives AgentWorthMcpServer as a real rmcp peer.
rmcp = { version = "=3.2.0", features = ["client"] }


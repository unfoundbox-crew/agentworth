  <text x="670" y="300" font-family="monospace, 'JetBrains Mono', Courier" font-size="14" fill="#52525b">INDEXED SESSIONS ......... 695</text>
  <text x="670" y="335" font-family="monospace, 'JetBrains Mono', Courier" font-size="14" fill="#52525b">DETECTED ADAPTERS ........ 11</text>
  <text x="670" y="370" font-family="monospace, 'JetBrains Mono', Courier" font-size="14" fill="#52525b">VERIFIED OUTCOMES ........ 412 (59%)</text>

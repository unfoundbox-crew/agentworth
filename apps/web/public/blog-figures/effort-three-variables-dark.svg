<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t1 d1">
  <title id="t1">Model, effort, and harness are three separate variables</title>
  <desc id="d1">A task fans out into three independent controls — which model runs it, how hard that model tries this turn, and what the harness lets it do — before recombining into an outcome. Effort is highlighted as the one this post is about.</desc>
  <style>
    .ink{fill:#ffffff}
    .muted{fill:#a1a1aa}
    .faint{fill:#52525b}
    .node{fill:#18181b;stroke:#2a2a2d;stroke-width:1.5}
    .node-accent{fill:#18181b;stroke:#a396d6;stroke-width:2}
    .edge{stroke:#52525b;stroke-width:1.4;fill:none}
    text{font-family:"Geist",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  </style>
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L0,5 L7,2.5 z" class="faint"/>
    </marker>
  </defs>

  <rect class="node" x="20" y="110" width="140" height="80" rx="14"/>
  <text class="ink" x="90" y="145" text-anchor="middle" font-size="17" font-weight="600">Task</text>
  <text class="muted" x="90" y="166" text-anchor="middle" font-size="12">what you asked for</text>

  <rect class="node" x="300" y="20" width="190" height="72" rx="14"/>
  <text class="ink" x="395" y="52" text-anchor="middle" font-size="16" font-weight="600">Model</text>
  <text class="muted" x="395" y="73" text-anchor="middle" font-size="12">which one runs it</text>

  <rect class="node-accent" x="300" y="114" width="190" height="72" rx="14"/>
  <text class="ink" x="395" y="146" text-anchor="middle" font-size="16" font-weight="700">Effort</text>
  <text class="muted" x="395" y="167" text-anchor="middle" font-size="12">how hard, this turn</text>

  <rect class="node" x="300" y="208" width="190" height="72" rx="14"/>
  <text class="ink" x="395" y="240" text-anchor="middle" font-size="16" font-weight="600">Harness</text>
  <text class="muted" x="395" y="261" text-anchor="middle" font-size="12">tools, retries, logging</text>

  <rect class="node" x="600" y="114" width="140" height="72" rx="14"/>
  <text class="ink" x="670" y="146" text-anchor="middle" font-size="16" font-weight="600">Outcome</text>
  <text class="muted" x="670" y="167" text-anchor="middle" font-size="12">done or not</text>

  <path class="edge" marker-end="url(#arrow1)" d="M160 145 C220 145 220 56 300 56"/>
  <path class="edge" marker-end="url(#arrow1)" d="M160 150 H300"/>
  <path class="edge" marker-end="url(#arrow1)" d="M160 155 C220 155 220 244 300 244"/>

  <path class="edge" marker-end="url(#arrow1)" d="M490 56 C550 56 550 145 600 145"/>
  <path class="edge" marker-end="url(#arrow1)" d="M490 150 H600"/>
  <path class="edge" marker-end="url(#arrow1)" d="M490 244 C550 244 550 155 600 155"/>
</svg>
